<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f4f9;
    --card: #ffffff;
    --ink: #16121c;
    --dim: #7b7488;
    --line: rgba(0, 0, 0, .07);
    --chip: rgba(0, 0, 0, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111014;
      --card: #1c1a22;
      --ink: #f3f0f7;
      --dim: #948da3;
      --line: rgba(255, 255, 255, .09);
      --chip: rgba(255, 255, 255, .08);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* No safe-area padding: the sheet's scroll view is inset for the nav bar and home
       indicator by UIKit, so adding env() here would double it. */
    padding: 12px 16px 28px;
    font: 17px/1.35 -apple-system, system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }

  .dim { color: var(--dim); font-size: 13px; }

  /* Filter chips */
  .chips { display: flex; gap: 8px; margin-bottom: 16px; }
  .chip {
    flex: 1;
    padding: 9px 6px;
    border: 0;
    border-radius: 999px;
    background: var(--chip);
    color: var(--dim);
    font: 600 13px -apple-system, system-ui, sans-serif;
    cursor: pointer;
    transition: transform .12s ease, background .18s ease, color .18s ease;
  }
  .chip:active { transform: scale(.94); }
  .chip.on { background: var(--ink); color: var(--bg); }

  /* Hero — the next birthday */
  .hero {
    position: relative;
    overflow: hidden;
    border-radius: 26px;
    padding: 26px 22px 22px;
    margin-bottom: 18px;
    text-align: center;
    color: #fff;
    background: linear-gradient(145deg,
      hsl(var(--h) 82% 62%), hsl(calc(var(--h) + 48) 78% 52%));
    box-shadow: 0 12px 28px -12px hsl(var(--h) 70% 45% / .8);
  }
  /* Soft light sweep, purely decorative. */
  .hero::after {
    content: '';
    position: absolute;
    inset: -60% -20% auto;
    height: 150%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, .3), transparent);
    pointer-events: none;
  }
  .cake {
    font-size: 54px;
    line-height: 1;
    animation: pop .9s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes pop {
    0%   { transform: scale(.3) rotate(-14deg); opacity: 0; }
    60%  { transform: scale(1.12) rotate(6deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cake { animation: none; }
  }
  .countdown {
    margin-top: 10px;
    font: 700 13px -apple-system, system-ui, sans-serif;
    letter-spacing: .09em;
    text-transform: uppercase;
    opacity: .92;
  }
  .hero-name { font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
  .hero-sub { font-size: 13px; opacity: .88; margin-top: 4px; }

  /* The rest of the list */
  .rest { display: flex; flex-direction: column; gap: 8px; }
  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--card);
  }
  .avatar {
    flex: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff;
    font: 700 14px -apple-system, system-ui, sans-serif;
    background: linear-gradient(145deg,
      hsl(var(--h) 78% 62%), hsl(calc(var(--h) + 40) 72% 50%));
  }
  .who { min-width: 0; flex: 1; }
  .name {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    flex: none;
    font: 600 12px -apple-system, system-ui, sans-serif;
    color: var(--dim);
    text-align: right;
  }

  .none { text-align: center; padding: 56px 20px; }
  .none-emoji { font-size: 44px; }
  .none p { margin: 6px 0 0; }

  /* Each swap fades in, so switching filters reads as a change rather than a flicker. */
  #app.htmx-added, #app > * { animation: fade .22s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
</style>

<div id="app" hx-get="/list?filter=30" hx-trigger="load"></div>
