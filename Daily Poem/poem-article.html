<!doctype html>
<!-- LoomWebSheet serves this as "text/html; charset=utf-8", but declaring it here too means the
     file is also correct opened directly in an editor or browser. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Poem</title>

<!--
  Static assets are not served, so all styling is inline. Loom injects htmx itself — no script tag
  or CDN link for it.

  This sheet runs with `bar: false`, so there is no navigation bar and no Done button: the page
  owns the full height and draws the masthead below. Two consequences that shape the markup:

  1. Loom still applies a top inset for the status bar, so there is still no viewport-fit=cover
     and no env(safe-area-inset-*) here — that would double-count.
  2. Swipe-to-dismiss is only recognised near the top of the page, so a long article would strand
     you. The masthead is sticky and tappable, and a floating ↑ appears once you scroll — both
     return you to where the swipe works. That is the price of losing the Done button, paid.

  Art direction is shared with the widget: one accent colour per strand, the same DAILY POEM
  wordmark, the same order of information. See widget.ts.
-->
<style>
  :root {
    color-scheme: light dark;
    --paper: #FBFAF7;
    --ink: #16151A;
    --rule: rgba(22, 21, 26, 0.13);
    --dim: rgba(22, 21, 26, 0.56);
    --accent: #241C63;
    --tint: rgba(36, 28, 99, 0.07);
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0E0E11;
      --ink: #F2F0EA;
      --rule: rgba(242, 240, 234, 0.15);
      --dim: rgba(242, 240, 234, 0.55);
      --accent: #A99CFF;
      --tint: rgba(169, 156, 255, 0.10);
    }
  }

  /* One accent per strand — the single strongest tie between this sheet and the widget, which
     uses the nearest name from its fixed palette (indigo / orange / teal). */
  .s-british  { --accent: #241C63; --tint: rgba(36, 28, 99, 0.07); }
  .s-american { --accent: #B23A0B; --tint: rgba(178, 58, 11, 0.07); }
  .s-european { --accent: #0C6B62; --tint: rgba(12, 107, 98, 0.07); }
  @media (prefers-color-scheme: dark) {
    .s-british  { --accent: #A99CFF; --tint: rgba(169, 156, 255, 0.10); }
    .s-american { --accent: #FF9457; --tint: rgba(255, 148, 87, 0.10); }
    .s-european { --accent: #4FD5C5; --tint: rgba(79, 213, 197, 0.10); }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font: 17px/1.5 -apple-system, system-ui, sans-serif;
    margin: 0; padding: 0 0 96px;
    background: var(--paper); color: var(--ink);
    overflow-wrap: break-word;
    -webkit-text-size-adjust: 100%;
  }

  /* Masthead — the page's own chrome, replacing the nav bar ---------------- */
  #mast {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 18px;
    background: color-mix(in srgb, var(--paper) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--rule);
  }
  #mast .word {
    font: 700 11px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: 0.19em; text-transform: uppercase;
    color: var(--ink); background: none; border: 0; padding: 0;
    white-space: nowrap;
  }
  #mast .word b { color: var(--accent); font-weight: 700; }
  #mast .sp { flex: 1; }
  #mast button, #mast input {
    font: 500 13px/1 -apple-system, system-ui, sans-serif;
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--rule); background: transparent; color: var(--dim);
  }
  #mast button.on { color: var(--accent); border-color: var(--accent); }
  #mast input { padding: 6px 8px; max-width: 122px; }
  #mast.htmx-request { opacity: 0.35; pointer-events: none; }
  #mast { transition: opacity 0.15s; }

  /* Hero ------------------------------------------------------------------ */
  .hero {
    position: relative; overflow: hidden;
    /* Tall enough that the headline sits below the face rather than across it. Scales with the
       screen so a Pro Max gets a properly cinematic opener, with a floor for the smallest phones
       and a cap so the article itself is still visible without scrolling. */
    min-height: clamp(400px, 56vh, 520px);
    display: flex; align-items: flex-end;
    background: linear-gradient(155deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #000));
  }
  /* An unillustrated article gets a shorter block: the height exists to clear a face, and with no
     photograph it is just a large wash of colour. */
  .hero.bare { min-height: 260px; }
  .hero img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    /* Portraits put the face high in the frame; a centred crop decapitates them. CSS can express
       this where the widget's w.image cannot — it is always scaledToFill, centred. */
    object-fit: cover; object-position: center 22%;
    filter: saturate(0.82) contrast(1.04);
  }
  /* Weighted to the bottom third so the text is legible without a grey wash creeping up over the
     face — the taller the hero, the more of the image should stay clear. */
  .hero .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top,
      rgba(0,0,0,0.90) 0%, rgba(0,0,0,0.62) 22%, rgba(0,0,0,0.16) 48%,
      rgba(0,0,0,0.04) 70%, rgba(0,0,0,0.26) 100%);
  }
  .hero .txt { position: relative; padding: 26px 18px 22px; width: 100%; }
  .hero .kicker { color: rgba(255,255,255,0.82); }
  .hero h1 {
    font: 600 34px/1.09 var(--serif);
    letter-spacing: -0.017em; margin: 8px 0 0; color: #fff;
    text-wrap: balance;
  }

  .kicker {
    margin: 0; font: 700 10.5px/1.4 -apple-system, system-ui, sans-serif;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent);
  }

  .wrap { padding: 0 18px; max-width: 44rem; margin: 0 auto; }

  .standfirst {
    font: 400 19px/1.47 var(--serif); color: var(--dim);
    margin: 20px 0 0; text-wrap: pretty;
  }

  /* The poem — the centrepiece, not a quote block -------------------------- */
  .poem {
    margin: 28px -18px 0; padding: 30px 26px 26px;
    background: var(--tint);
    border-top: 2px solid var(--accent); border-bottom: 1px solid var(--rule);
  }
  .poem .ptitle { font: 600 23px/1.22 var(--serif); margin: 0; letter-spacing: -0.01em; }
  .poem .pauthor {
    margin: 7px 0 18px; font: 500 11px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: 0.13em; text-transform: uppercase; color: var(--accent);
  }
  .poem pre {
    font: 400 17px/1.74 var(--serif);
    margin: 0; white-space: pre-wrap; word-break: break-word;
  }
  .poem .plink {
    display: inline-block; margin-top: 20px; font-size: 12.5px;
    color: var(--dim); text-decoration-color: var(--rule);
  }

  /* Sections -------------------------------------------------------------- */
  .parts { counter-reset: part; }
  section.part { counter-increment: part; margin-top: 40px; }
  section.part h2 {
    font: 600 25px/1.2 var(--serif); margin: 0 0 14px;
    letter-spacing: -0.014em; text-wrap: balance;
  }
  section.part h2::before {
    content: counter(part, decimal-leading-zero);
    display: block; margin-bottom: 9px;
    font: 700 10.5px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: 0.16em; color: var(--accent);
  }
  section.part figure { margin: 0 -18px 18px; }
  section.part img { width: 100%; height: auto; display: block; background: var(--tint); }
  section.part figcaption {
    margin: 7px 18px 0; font-size: 11.5px; color: var(--dim);
    letter-spacing: 0.02em;
  }
  section.part figcaption a { color: inherit; }

  .body { font: 400 17.5px/1.66 var(--serif); }
  .body p { margin: 0 0 15px; text-wrap: pretty; }
  /* A drop cap on each section's opening paragraph — the one flourish that says "magazine"
     loudest for the least code. */
  .body > p:first-of-type::first-letter {
    float: left; font: 600 3.15em/0.82 var(--serif); color: var(--accent);
    padding: 0.04em 0.09em 0 0;
  }
  .body blockquote {
    margin: 20px 0; padding: 4px 0 4px 18px;
    border-left: 2px solid var(--accent);
    font-style: italic; color: var(--dim); white-space: pre-wrap;
  }
  .body a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent);
            text-underline-offset: 3px; text-decoration-thickness: 2px; }
  .body h3 { font: 600 18px/1.3 var(--serif); margin: 22px 0 8px; }

  /* Sources — set quietly. It is apparatus, not part of the read, but every link in
     the prose is checked against it, so it should be there to check. ---------- */
  .sources { margin: 40px 0 0; padding-top: 20px; border-top: 1px solid var(--rule); }
  .sources h2 {
    font: 600 12px/1 -apple-system, system-ui, sans-serif;
    letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 0 0 12px;
  }
  .sources ol { margin: 0; padding-left: 1.2em; }
  .sources li { font: 400 14px/1.5 -apple-system, system-ui, sans-serif; margin: 0 0 7px; }
  .sources a { color: var(--dim); text-decoration: underline; text-underline-offset: 2px; }

  /* Actions --------------------------------------------------------------- */
  .likebar {
    display: flex; gap: 10px; align-items: center;
    margin: 44px 0 0; padding-top: 22px; border-top: 1px solid var(--rule);
  }
  button.like {
    font: 600 15px/1 -apple-system, system-ui, sans-serif;
    padding: 12px 20px; border-radius: 999px;
    border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
  }
  button.like.on { background: var(--accent); color: var(--paper); }
  .likebar button.ghost {
    font: 500 15px/1 -apple-system, system-ui, sans-serif;
    padding: 12px 18px; border-radius: 999px;
    border: 1px solid var(--rule); background: transparent; color: var(--dim);
  }

  /* Back to top — the dismissal safety valve for a barless sheet ----------- */
  #totop {
    position: fixed; right: 16px; bottom: 22px; z-index: 30;
    width: 46px; height: 46px; border-radius: 999px;
    border: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(18px); color: var(--accent);
    font-size: 19px; line-height: 1;
    opacity: 0; pointer-events: none; transform: translateY(8px);
    transition: opacity 0.18s, transform 0.18s;
  }
  #totop.show { opacity: 1; pointer-events: auto; transform: none; }

  /* Panels (progress, offer, error, empty) --------------------------------- */
  .panel { padding: 76px 4px; text-align: center; }
  .panel h2 { font: 600 24px/1.25 var(--serif); margin: 0 0 10px; letter-spacing: -0.012em; }
  .panel p { color: var(--dim); margin: 7px 0; font-size: 15px; }
  .panel .bar {
    height: 3px; border-radius: 2px; background: var(--rule);
    margin: 22px auto 10px; max-width: 260px; overflow: hidden;
  }
  .panel .bar i { display: block; height: 100%; background: var(--accent); transition: width 0.4s; }
  .panel button {
    font: 600 15px/1 -apple-system, system-ui, sans-serif;
    margin-top: 20px; padding: 12px 22px; border-radius: 999px;
    border: none; background: var(--accent); color: var(--paper);
  }
  .panel button.ghost {
    background: transparent; color: var(--dim); border: 1px solid var(--rule);
  }
  .panel .err { color: #C2410C; font-size: 13.5px; }
  @media (prefers-color-scheme: dark) { .panel .err { color: #FF9457; } }

  /* Liked ----------------------------------------------------------------- */
  .liked { margin: 8px 0 0; padding: 0; list-style: none; }
  .liked li { border-bottom: 1px solid var(--rule); }
  .liked button {
    display: block; width: 100%; text-align: left; font: inherit;
    background: none; border: none; color: var(--ink); padding: 18px 0;
  }
  .liked .ln {
    font: 700 10px/1 -apple-system, system-ui, sans-serif; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 7px;
  }
  .liked .lt { font: 600 18px/1.26 var(--serif); display: block; letter-spacing: -0.01em; }
  .liked .lm { font-size: 13px; color: var(--dim); margin-top: 5px; display: block; }
</style>

<header id="mast">
  <!-- Doubles as the scroll-to-top target: with no Done button, getting back to the top is what
       makes swipe-to-dismiss reachable again. -->
  <button class="word" onclick="scrollTo({top:0})">Daily&nbsp;<b>Poem</b></button>
  <span class="sp"></span>
  <button hx-get="/view" hx-target="#app" hx-swap="innerHTML">Today</button>
  <button hx-get="/liked" hx-target="#app" hx-swap="innerHTML">Liked</button>
  <input type="date" name="date" hx-get="/view" hx-target="#app" hx-swap="innerHTML"
         hx-trigger="change">
</header>

<div id="app" hx-get="/view" hx-trigger="load"></div>

<button id="totop" onclick="scrollTo({top:0})" aria-label="Back to top">↑</button>

<script>
  // Only appears once you are far enough down that swipe-to-dismiss has stopped working.
  addEventListener('scroll', function () {
    document.getElementById('totop').classList.toggle('show', scrollY > 700);
  }, { passive: true });
</script>
